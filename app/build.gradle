// build.gradle (Module :app)

// ✅ 'apply plugin' 대신 이 방식을 사용합니다. (이미 올바르게 되어 있음)
plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.inhatc.localit'
    compileSdk 35

    defaultConfig {
        applicationId "com.inhatc.localit"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }
}

// ✅ Room 버전을 사용하기 전에 변수를 정의합니다.
def room_version = "2.6.1" // 원하는 Room 라이브러리 버전

dependencies {
    // Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:34.0.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore-ktx:24.7.1'
    implementation 'com.google.firebase:firebase-storage'

    // AndroidX & Google Material
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.3'
    implementation 'androidx.recyclerview:recyclerview:1.3.2' // libs.recyclerview 대신 명시적 버전 사용 권장

    // Room DB
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // Social Login
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
    implementation "com.kakao.sdk:v2-user:2.19.0"
    implementation 'com.navercorp.nid:oauth:5.7.0'
    // implementation libs.credentials // Gradle Version Catalog 사용 시 주석 해제
    // implementation libs.credentials.play.services.auth // Gradle Version Catalog 사용 시 주석 해제
    // implementation libs.googleid // Gradle Version Catalog 사용 시 주석 해제

    // Network (Retrofit) & Image Loading (Glide)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-simplexml:2.11.0' // XML 파싱이 필요할 경우
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // ❌ 삭제: 'dependencies' 블록 안에는 있을 수 없습니다.
    // apply plugin: 'com.google.gms.google-services'
}