android {
    namespace 'com.inhatc.localit'
    compileSdk 35

    defaultConfig {
        applicationId "com.inhatc.localit"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // 네이버 지도 클라이언트 아이디 (AndroidManifest에 주입)
        manifestPlaceholders = [
                NAVERMAP_CLIENT_ID: localProps.getProperty("NAVERMAP_CLIENT_ID", "")
        ]

        // TourAPI 키를 BuildConfig로 노출
        buildConfigField "String", "TOUR_API_KEY", "\"${localProps.getProperty("TOUR_API_KEY", "")}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true   // ← BuildConfig 사용 에러 해결 포인트
    }
}

