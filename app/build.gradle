
plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

def localProps = new Properties()
def lpFile = rootProject.file("local.properties")
if (lpFile.exists()) {
    lpFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.inhatc.localit'
    compileSdk 35

    defaultConfig {
        applicationId "com.inhatc.localit"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // 네이버 지도 클라이언트 아이디 (AndroidManifest에 주입)
        manifestPlaceholders = [
                NAVERMAP_CLIENT_ID: localProps.getProperty("NAVERMAP_CLIENT_ID", "")
        ]

        // TourAPI 키를 BuildConfig로 노출
        buildConfigField "String", "TOUR_API_KEY", "\"${localProps.getProperty("TOUR_API_KEY", "")}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
        compose true// ← BuildConfig 사용 에러 해결 포인트
    }
}

// ✅ Room 버전을 사용하기 전에 변수를 정의합니다.
def room_version = "2.6.1" // 원하는 Room 라이브러리 버전

dependencies {
    // 네이버 지도 SDK 추가
    implementation "com.naver.maps:map-sdk:3.22.1"

    // Firebase BoM 및 종속성
    implementation platform("com.google.firebase:firebase-bom:34.0.0")
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"
    implementation "com.google.firebase:firebase-storage"

    // AndroidX & Google Material
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.browser:browser:1.8.0"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"

    // Navigation
    implementation "androidx.navigation:navigation-fragment:2.7.7"
    implementation "androidx.navigation:navigation-ui:2.7.7"

    // Room DB
    implementation "androidx.room:room-runtime:$room_version"
    implementation libs.activity.compose
    implementation platform(libs.compose.bom)
    implementation libs.ui
    implementation libs.ui.graphics
    implementation libs.ui.tooling.preview
    implementation libs.material3
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.ui.test.junit4
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // Network (Retrofit) & Image Loading (Glide)
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.retrofit2:converter-simplexml:2.11.0"
    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"

    // Social Login
    implementation "com.google.android.gms:play-services-auth:21.0.0"
    implementation "com.kakao.sdk:v2-user:2.19.0"
    implementation "com.navercorp.nid:oauth:5.7.0"

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    debugImplementation libs.ui.tooling
    debugImplementation libs.ui.test.manifest
}
